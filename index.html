<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F2EEE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A2E24" media="(prefers-color-scheme: dark)">
  <title>Pleur</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Pleur<span class="brand-dot">.</span></div>
    <div class="topbar-right">
      <span class="topbar-sub" id="topbar-sub"></span>
      <button class="icon-btn" id="backup-btn" aria-label="Back-up en herstel" title="Back-up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.4c.1 3.4.2 6.8.1 10.2"/><path d="M8.3 10c1.3 1.2 2.5 2.5 3.6 3.9 1.2-1.5 2.5-2.8 3.9-4"/><path d="M4.6 15.3c-.2 1.7-.1 3.4.3 5 4.7.5 9.5.5 14.2 0 .4-1.7.5-3.4.3-5.1"/></svg></button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button class="tab" data-tab="gear">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M6.4 11.2c-.2-.7.3-1.3 1-1.3l10.3.2c.7 0 1.1.5 1 1.2l-.8 4.6c-.3 1.6-1.8 2.8-3.4 2.7l-4.3-.1c-1.6 0-2.9-1.2-3.1-2.7z"/><path d="M6.5 10.6c2-1.3 10.6-1.4 12.5.2"/><path d="M11 18.6c.1 1.2.2 2.4.4 3.5M14.2 18.7c0 1.1-.1 2.3-.2 3.4"/><path d="M18.7 12.9c2.6-.3 5.3.1 7.9.8.9.3 1.3 1.1.9 1.8-.4.7-1.4.9-2.3.7-2-.5-4.1-.8-6.3-.8"/></svg>
      <span>Uitrusting</span>
    </button>
    <button class="tab" data-tab="coffees">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M25.3 9c1.2 2.7-.6 6.8-4.3 9.9-3.9 3.3-8.8 4.7-11.5 3.2"/><path d="M9.5 22.1c-2.6-1.6-2.7-5.3.4-9 3.2-3.9 8.4-6.3 11.7-5.4"/><path d="M21.6 7.7c1.7.5 3 1.6 3.7 3.1"/><path d="M9.3 21.9c2.9-1.1 3.6-4.2 6-6.4 2.5-2.3 5.5-2.2 8.1-4.4"/><path d="M12.4 21.3c.9-.6 1.6-1.4 2.2-2.3"/></svg>
      <span>Koffies</span>
    </button>
    <button class="tab" data-tab="recipes">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"><path d="M6.8 9.6c4.3-1.1 14.1-1 18.4.2"/><path d="M6.9 9.7 15 21.5c.6 1 1.9 1 2.5.1L25.2 9.8"/><path d="M11.6 10.4c1.1 3.5 2.3 7 3.6 10.4M20.6 10.5c-1 2.7-2.1 5.3-3.3 7.9"/><path d="M16 24.2c-1 1.4-1.6 2.4-1.6 3.3 0 1 .7 1.7 1.6 1.7.9 0 1.6-.7 1.6-1.7 0-.9-.6-1.9-1.6-3.3z"/></svg>
      <span>Recepten</span>
    </button>
  </nav>

  <div id="modal-root"></div>

  <script src="js/db.js"></script>
  <script src="js/land.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Nieuwe versie? Ververs de pagina één keer, zodat je nooit
    // half oude en half nieuwe bestanden ziet.
    if ('serviceWorker' in navigator) {
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
      navigator.serviceWorker.register('sw.js').then(reg => reg.update());
    }
  </script>
</body>
</html>
